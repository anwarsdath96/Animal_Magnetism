<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoPMO Dashboard</title>
<script>
// Apply saved theme before the browser paints to prevent a theme flash.
(function(){
  let theme="light";
  try { theme=localStorage.getItem("nopmo-theme")||"light"; } catch(e) {}
  document.documentElement.classList.toggle("light",theme!=="dark");
  document.documentElement.classList.toggle("dark",theme==="dark");
  document.documentElement.style.colorScheme=theme==="dark"?"dark":"light";
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#070b10;color:#f4f7fb}
.app{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:26px;margin:0 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{border:1px solid #243547;background:#0e1722;color:#a8b9cc;border-radius:9px;padding:7px 14px;font-size:12px;font-weight:650;cursor:pointer}
.tab.active{background:#1c3b63;border-color:#528bd0;color:#fff}
.range{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.range-spacer{flex:1}
.range button{border:1px solid #243547;background:#0e1722;color:#a8b9cc;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.range button.active{background:#1c3b63;border-color:#528bd0;color:#fff}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.metrics.single{grid-template-columns:220px}
.metric{background:#111a24;border:1px solid rgba(148,170,196,.16);border-radius:13px;padding:14px 16px}
.metric-label{color:#8b9bb0;font-size:11px;margin-bottom:6px;letter-spacing:.02em}
.metric-value{font-size:22px;font-weight:650}
.metric-small{color:#8b9bb0;font-size:12px;margin-top:3px}
.chart-card{background:#111a24;border:1px solid rgba(148,170,196,.16);border-radius:13px;padding:14px 16px 12px}
.chart-title{font-size:15px;font-weight:600;margin-bottom:10px}
.chart{height:148px;display:flex;align-items:flex-end;gap:6px;padding-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;min-width:0}
.bar-value{font-size:9px;color:#c5d0dc;margin-bottom:3px;white-space:nowrap}
.bar{width:54%;min-height:3px;border-radius:5px 5px 1px 1px}
.bar.yes{background:#55e3a1}
.bar.no{background:#eb6b78}
.bar.empty{background:#26313c}
.bar-label{font-size:9px;margin-top:5px;color:#9aa3ad;background:#0a1118;border:1px solid rgba(148,170,196,.16);border-radius:8px;padding:1px 5px}
.cal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cal-month{background:#111a24;border:1px solid rgba(148,170,196,.16);border-radius:13px;padding:12px}
.cal-head{font-size:14px;font-weight:650;margin-bottom:8px}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.cal-week span{text-align:center;color:#8b9bb0;font-size:10px}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{aspect-ratio:1;display:grid;place-items:center;font-size:11px;border-radius:50%;color:#6b7a8c}
.cal-day.yes{background:#1f7a4d;color:#fff}
.cal-day.no{background:#8b2d36;color:#fff}
.cal-day.streak{background:#7dffa1;color:#0b1a10;font-weight:700}
@media(max-width:800px){.cal-grid{grid-template-columns:1fr}}
.editor{display:none;flex-direction:column;min-height:420px}
.editor.show{display:flex}
textarea{flex:1;min-height:360px;width:100%;resize:none;border:1px solid rgba(148,170,196,.16);border-radius:13px;background:#111a24;color:#f4f7fb;font:15px/1.55 Arial,sans-serif;padding:16px;outline:none}
.save-row{margin-top:12px;display:flex;justify-content:flex-end}
.save-btn{border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,#f5f8fb,#dfe7ef);color:#071018;padding:10px 18px;border-radius:9px;font-weight:700;font-size:12px;cursor:pointer}
.save-btn.saved{background:#4fd18a!important;color:#102016!important;border-color:#4fd18a!important}
.auth{max-width:360px;margin:80px auto;background:#111a24;border:1px solid rgba(148,170,196,.16);border-radius:14px;padding:24px}
.auth h2{margin:0 0 16px;font-size:18px}
.auth input{width:100%;padding:12px;border-radius:9px;border:1px solid #303640;background:#0a1118;color:#f4f7fb;margin-bottom:10px;font-size:14px}
.auth button{width:100%;padding:12px;border:0;border-radius:9px;background:#f1f3f5;color:#111;font-weight:650;cursor:pointer}
.hidden{display:none!important}
.progress{display:none;align-items:flex-end;justify-content:center;gap:36px;padding:40px 20px 30px;min-height:360px}
.progress.show{display:flex}
.stage{display:flex;flex-direction:column;align-items:center;gap:12px}
.bubble{border-radius:50%;background:#2a3340;transition:background .2s}
.bubble.done{background:#55e3a1}
.bubble.current{background:#3d9e78;box-shadow:0 0 0 3px rgba(85,227,161,.35)}
.stage-label{font-size:12px;color:#8b9bb0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.logout{background:transparent;border:1px solid #243547;color:#a8b9cc;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer}
.theme-btn{width:32px;height:32px;border:1px solid #243547;border-radius:9px;background:#0e1722;color:#f0c56b;cursor:pointer;display:grid;place-items:center}
.theme-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{gap:8px}
html.light body{background:#eef2f6;color:#1d2b3d}
html.light body .metric,html.light body .chart-card,html.light body .cal-month{background:#fff;border-color:#d5dee8}
html.light body .metric-label,html.light body .metric-small,html.light body .cal-week span,html.light body .stage-label{color:#5c6d82}
html.light body .stage.done .stage-label,html.light body .stage.current .stage-label{color:#5c6d82}
html.light body .tab,html.light body .range button,html.light body .logout,html.light body .theme-btn{background:#fff;border-color:#d5dee8;color:#243b58}
html.light body .range button.active{background:#1c3b63;border-color:#528bd0;color:#fff}
html.light body .cal-day{color:#8a97a6}
html.light body .bar-label{background:#eef2f6;color:#3d4d61;border-color:#d5dee8}
html.light body .bar-value{color:#5c6d82}
html.light body .cal-day.yes,html.light body .cal-day.no{color:#fff}
html.light body .bubble{background:#d7dee6}
@media(max-width:700px){.metrics{grid-template-columns:1fr 1fr}.chart{gap:3px}}

/* Mobile-only NoPMO refinements */
@media(max-width:700px){
  .app{max-width:100%;padding:14px 10px 32px}
  .range{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:12px;align-items:stretch}
  .range-spacer{display:none}
  .range button{width:100%;min-width:0;min-height:42px;padding:5px 2px;font-size:10px;line-height:1.15;white-space:normal;border-radius:8px}
  .range button[data-range="180"],.range button[data-range="year"]{display:none}
  .range button[data-range="30"]{display:none}
  .range button.mobile-month{display:block}
  .range .theme-btn{width:34px;min-height:34px;grid-column:3;justify-self:end}
  .range .logout{grid-column:4;justify-self:end;min-height:34px}
  .metrics{gap:7px;margin-bottom:10px}
  .metric{padding:10px 11px;border-radius:11px}
  .metric-label{font-size:10px;line-height:1.2}
  .metric-value{font-size:20px}
  .metric-small{font-size:11px}
  .chart-card{padding:11px 10px}
  .cal-grid{grid-template-columns:1fr;gap:9px}
  .cal-month{padding:10px;border-radius:11px}
  .cal-days{gap:3px}
  .cal-day{font-size:10px}
  .progress{flex-direction:column;align-items:center;justify-content:flex-start;gap:14px;padding:20px 10px 24px;min-height:0}
  .stage{gap:5px}
  .stage-label{font-size:11px}
}
@media(min-width:701px){.range button.mobile-month{display:none}}
</style>
</head>
<body>
<div id="authView" class="auth">
  <h2>NoPMO Dashboard</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button onclick="signIn()">Sign in</button>
  <div id="authMsg" style="color:#eb6b78;font-size:13px;margin-top:10px"></div>
</div>

<div id="dashView" class="app hidden">
  <div id="dashboardPane">
    <div class="range">
      <button class="active" data-range="progress" onclick="setRange('progress')">Progress</button>
      <button data-range="7" onclick="setRange('7')">Last 7 days</button>
      <button data-range="30" onclick="setRange('30')">Last 30 days</button>
      <button class="mobile-month" data-range="month" onclick="setRange('month')">This Month</button>
      <button data-range="90" onclick="setRange('90')">Last 3 Months</button>
      <button data-range="180" onclick="setRange('180')">Last 6 Months</button>
      <button data-range="year" onclick="setRange('year')">This Year</button>
      <span class="range-spacer"></span>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Switch theme">
        <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8.2 14.5a7 7 0 1 1 7.6 0c-.9.6-1.4 1.5-1.5 2.5h-4.6c-.1-1-.6-1.9-1.5-2.5Z"/><path d="M12 2v1.5M4.9 4.9 6 6M2 12h1.5M20.5 12H22M18 6l1.1-1.1"/></svg>
      </button>
      <button class="logout" onclick="signOut()">Log out</button>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="chart-card" id="chartCard">
      <div class="chart-title">Daily Commitment</div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="progress" id="progressPane"></div>
  </div>

</div>

<script>
const SUPABASE_URL="https://tgrgfksbbcvgyinipxqo.supabase.co";
const SUPABASE_KEY="sb_publishable_qXwSi3Go5Zf1ShGbg0Lb_w_5YVNlt28";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const DEFINITION_DATE="1970-01-01";
let user=null, rangeDays="progress";

function dateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");return `${y}-${m}-${day}`;}
function getRange(key){
  const today=new Date();today.setHours(0,0,0,0);
  let start,end;
  if(key==="year"){
    start=new Date(today.getFullYear(),0,1);
    end=new Date(today.getFullYear(),11,31);
  } else if(key==="month"){
    start=new Date(today.getFullYear(),today.getMonth(),1);
    end=new Date(today.getFullYear(),today.getMonth()+1,0);
  } else if(key==="90"||key==="180"){
    const months=key==="90"?2:5;
    start=new Date(today.getFullYear(),today.getMonth()-months,1);
    end=new Date(today.getFullYear(),today.getMonth()+1,0);
  } else {
    end=today;
    start=new Date(today);start.setDate(today.getDate()-(Number(key)-1));
  }
  const out=[];
  for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) out.push(dateStr(d));
  return out;
}
function rangeLabel(key){
  return {7:"last 7 days",30:"last 30 days",month:"this month",90:"last 3 months",180:"last 6 months",year:"this year"}[key]||"";
}
function rangeDaysCount(key){return key==="year"||key==="month"?getRange(key).length:Number(key);}

async function getExact(system,start,end){
  const {data}=await sb.from("system_entries").select("entry_date,data").eq("user_id",user.id).eq("system",system).gte("entry_date",start).lte("entry_date",end).order("entry_date",{ascending:true});
  const map={};(data||[]).forEach(r=>map[r.entry_date]=r.data||{});return map;
}
async function getEntries(start,end){
  const [legacy,current]=await Promise.all([getExact("Nofap",start,end),getExact("NoPMO",start,end)]);
  return {...legacy,...current};
}

function streak(dates,data){let s=0;for(let i=dates.length-1;i>=0;i--){if(data[dates[i]]&&data[dates[i]].value==="yes")s++;else break;}return s;}

async function render(){
  const dates=getRange(rangeDays);
  const today=dateStr(new Date());
  const countDates=dates.filter(d=>d<=today);
  const count=countDates.length;
  const data=await getEntries(dates[0],dates[dates.length-1]);
  const logged=countDates.filter(d=>data[d]&&data[d].value);
  const yes=logged.filter(d=>data[d].value==="yes");
  const consistency=Math.round(logged.length/(rangeDays==="month"?countDates.length:dates.length)*100)+"%";
  const follow=logged.length?Math.round(yes.length/logged.length*100)+"%":"—";
  const st=streak(countDates,data);
  const label=rangeLabel(rangeDays);
  document.getElementById("metrics").innerHTML=[
    [`DAYS KEPT · ${count} DAYS`,yes.length,`${follow} of logged days`],
    ["CURRENT STREAK",st,st===1?"day":"days"],
    ["DAYS LOGGED",logged.length,`of ${count}`],
    ["LOGGING CONSISTENCY",consistency,label]
  ].map(([l,v,s])=>`<div class="metric"><div class="metric-label">${l}</div><div class="metric-value">${v}</div><div class="metric-small">${s}</div></div>`).join("");

  const card=document.getElementById("chartCard");
  const prog=document.getElementById("progressPane");
  if(rangeDays==="progress"){
    card.style.display="none";
    prog.classList.add("show");
    const yearDates=getRange("year");
    const todayKey=dateStr(new Date());
    const upto=yearDates.filter(d=>d<=todayKey);
    const yearData=await getEntries(upto[0],upto[upto.length-1]);
    const realStreak=streak(upto,yearData);
    document.getElementById("metrics").classList.add("single");document.getElementById("metrics").innerHTML=`<div class="metric"><div class="metric-label">CURRENT STREAK</div><div class="metric-value">${realStreak}</div><div class="metric-small">${realStreak===1?"day":"days"}</div></div>`;
    renderProgress(realStreak);
    return;
  }
  card.style.display="";
  prog.classList.remove("show");
  document.getElementById("metrics").classList.remove("single");
  if(rangeDays==="7"||rangeDays==="30"){
    card.querySelector(".chart-title").textContent="Daily Commitment";
    card.querySelector(".chart-title").style.display="";
    document.getElementById("chart").className="chart";
    document.getElementById("chart").innerHTML=dates.map(d=>{
      const e=data[d];
      let cls="empty",txt="";
      if(e&&e.value==="yes"){cls="yes";txt="Yes";}
      else if(e&&e.value){cls="no";txt=e.tier?e.tier[0].toUpperCase()+e.tier.slice(1):"No";}
      const day=new Date(d+"T00:00:00").getDate();
      return `<div class="bar-col"><div class="bar-value">${txt}</div><div class="bar ${cls}" style="height:${cls==="yes"?"100%":cls==="no"?"28%":"3px"}"></div><div class="bar-label">${day}</div></div>`;
    }).join("");
  } else {
    card.querySelector(".chart-title").style.display="none";
    document.getElementById("chart").className="cal-grid";
    document.getElementById("chart").innerHTML=renderCalendar(dates,data,streakDates(dates,data));
  }
}
const STAGES=[{d:2,s:48,c:"#6b5344"},{d:7,s:72,c:"#c47a2a"},{d:14,s:96,c:"#c9a227"},{d:30,s:124,c:"#3d6ea8"},{d:60,s:156,c:"#2f7a4f"},{d:90,s:192,c:"#6b4c9a"},{d:180,s:236,c:"#a85a78"}];
function scale(hex, f){
  const n=parseInt(hex.slice(1),16);
  const ch=v=>Math.max(0,Math.min(255,Math.round(v*f)));
  const r=ch(n>>16), g=ch((n>>8)&255), b=ch(n&255);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function mixWhite(hex, f){
  const n=parseInt(hex.slice(1),16);
  const ch=(v,w)=>Math.round(v*(1-w)+255*w);
  const r=ch(n>>16,f), g=ch((n>>8)&255,f), b=ch(n&255,f);
  return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function renderProgress(streak){
  document.getElementById("progressPane").innerHTML=STAGES.map((st,i)=>{
    const prev=i===0?0:STAGES[i-1].d;
    const done=streak>=st.d;
    const current=!done && streak>=prev;
    const cls=done?"done":current?"current":"";
    const light=document.documentElement.classList.contains("light");
    const dark=light?mixWhite(st.c,0.82):scale(st.c,0.16);
    const mid=st.c;
    const bright=scale(st.c,1.25);
    const pct=done?100:current?Math.round((streak-prev)/(st.d-prev)*100):0;
    const fill=done?bright:current?`conic-gradient(${mid} ${pct}%, ${dark} ${pct}%)`:dark;
    return `<div class="stage ${cls}"><div class="bubble ${cls}" style="width:${st.s}px;height:${st.s}px;background:${fill}"></div><div class="stage-label">${st.d} days</div></div>`;
  }).join("");
}
function streakDates(dates,data){
  const today=dateStr(new Date());
  const upto=dates.filter(d=>d<=today);
  const set=new Set();
  for(let i=upto.length-1;i>=0;i--){
    if(data[upto[i]]&&data[upto[i]].value==="yes") set.add(upto[i]);
    else break;
  }
  return set;
}
function renderCalendar(dates,data,streakSet){
  const set=new Set(dates);
  const months={};
  dates.forEach(d=>{const [y,m]=d.split("-");const k=y+"-"+m;(months[k]=months[k]||[]).push(d);});
  const names=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return Object.keys(months).map(k=>{
    const [y,m]=k.split("-").map(Number);
    const first=new Date(y,m-1,1);
    const start=first.getDay();
    const daysIn=new Date(y,m,0).getDate();
    let cells="";
    for(let i=0;i<start;i++) cells+=`<div></div>`;
    for(let d=1;d<=daysIn;d++){
      const key=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      if(!set.has(key)){cells+=`<div class="cal-day">${d}</div>`;continue;}
      const e=data[key];
      const cls=streakSet&&streakSet.has(key)?"streak":e&&e.value==="yes"?"yes":e&&e.value?"no":"";
      cells+=`<div class="cal-day ${cls}">${d}</div>`;
    }
    const title=first.toLocaleDateString("en-US",{month:"long",year:"numeric"});
    return `<div class="cal-month"><div class="cal-head">${title}</div><div class="cal-week">${names.map(n=>`<span>${n}</span>`).join("")}</div><div class="cal-days">${cells}</div></div>`;
  }).join("");
}

async function loadDefinition(){
  const rows=await getExact("NoPMO",DEFINITION_DATE,DEFINITION_DATE);
  const saved=rows[DEFINITION_DATE];
  document.getElementById("defText").value=saved?.text||(Array.isArray(saved?.bullets)?saved.bullets.join("\n"):"");
}
async function saveDefinition(){
  const text=document.getElementById("defText").value;
  const bullets=text.split(/\n/).map(l=>l.replace(/^\s*[•\-\*]\s*/,"").trim()).filter(Boolean);
  const {error}=await sb.from("system_entries").upsert({user_id:user.id,engine:"Personal Engine",system:"NoPMO",entry_date:DEFINITION_DATE,data:{text,bullets}},{onConflict:"user_id,system,entry_date"});
  if(error){alert("Could not save: "+error.message);return;}
  const btn=document.getElementById("saveBtn");
  btn.classList.add("saved");btn.textContent="Saved";
  setTimeout(()=>{btn.classList.remove("saved");btn.textContent="Save";},900);
}

function setRange(key){
  rangeDays=key;
  document.querySelectorAll(".range button").forEach(b=>b.classList.toggle("active",b.dataset.range===key));
  render();
}
function showTab(tab){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));
  document.getElementById("dashboardPane").classList.toggle("hidden",tab!=="dashboard");
  document.getElementById("definitionPane").classList.toggle("show",tab==="definition");
  if(tab==="definition") loadDefinition();
}

async function signIn(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById("authMsg").textContent=error.message;return;}
  onSignedIn(data.user);
}
async function signOut(){await sb.auth.signOut();user=null;document.getElementById("dashView").classList.add("hidden");document.getElementById("authView").classList.remove("hidden");}
async function onSignedIn(u){
  user=u;
  document.getElementById("authView").classList.add("hidden");
  document.getElementById("dashView").classList.remove("hidden");
  await render();
}
function toggleTheme(){
  const light=document.documentElement.classList.toggle("light");
  document.documentElement.classList.toggle("dark",!light);
  document.body.classList.toggle("light",light);
  document.documentElement.style.colorScheme=light?"light":"dark";
  localStorage.setItem("nopmo-theme",light?"light":"dark");
  if(rangeDays==="progress") render();
}
sb.auth.getSession().then(({data})=>{if(data.session) onSignedIn(data.session.user);});
</script>
</body>
</html>
